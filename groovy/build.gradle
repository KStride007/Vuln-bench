plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

// Intentionally vulnerable dependency versions (SCA test targets).
// CVE ground truth lives in manifest.json.
dependencies {
    implementation 'org.codehaus.groovy:groovy-all:2.4.3'
    implementation 'org.apache.commons:commons-collections4:4.0'
    implementation 'commons-collections:commons-collections:3.2.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.8'
    implementation 'org.yaml:snakeyaml:1.26'
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'
    runtimeOnly 'com.h2database:h2:2.1.214'
}

application {
    mainClass = 'vulngroovy.Server'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src']
            // extras/ depends on a @Grab-only dependency and is not part of the running app
            exclude 'vulngroovy/extras/**'
        }
    }
}
